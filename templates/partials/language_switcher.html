{% load i18n %}{# Til tanlash: header'da va kirish sahifalarida. next — to'liq yo'l (?query bilan), aks holda filtrlar yo'qolardi. #}
<form method="post" action="{% url 'set_language' %}" class="flex items-center">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% get_current_language as CURRENT_LANGUAGE %}
  {% get_available_languages as LANGUAGES %}
  <select name="language" onchange="this.form.submit()" aria-label="{% trans 'Language' %}"
          class="rounded-lg border border-gray-300 bg-white px-2 py-1 text-sm dark:border-gray-600 dark:bg-gray-700">
    {% for code, name in LANGUAGES %}
      <option value="{{ code }}" lang="{{ code }}" {% if code == CURRENT_LANGUAGE %}selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit" class="btn btn-secondary btn-sm ml-1">OK</button></noscript>
</form>
