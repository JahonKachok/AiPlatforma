# Loglar cheksiz o'sib, diskni to'ldirib qo'ymasin (har xizmatga ~30 MB).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: aiplatforma_redis
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    networks:
      - app_network

  db:
    image: postgres:16-alpine
    container_name: aiplatforma_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aiplatforma}
      - POSTGRES_USER=${POSTGRES_USER:-aiplatforma}
      # Standart parol ataylab yo'q: `?` bilan compose POSTGRES_PASSWORD
      # berilmagan bo'lsa ishga tushmaydi. Ilgari `aiplatforma123` bo'lgani
      # uchun ko'p o'rnatmalar hammaga ma'lum parol bilan qolib ketardi.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da belgilanishi shart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiplatforma}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bazaning kunlik nusxasi (deploy/db-backup.sh). Nusxalar db_backups
  # volume'ida; web uni faqat o'qish uchun ko'radi va saytdagi "Backups"
  # zip'iga eng oxirgisini qo'shadi.
  db-backup:
    image: postgres:16-alpine
    container_name: aiplatforma_db_backup
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "/db-backup.sh"]
    environment:
      - PGHOST=db
      - PGDATABASE=${POSTGRES_DB:-aiplatforma}
      - PGUSER=${POSTGRES_USER:-aiplatforma}
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da belgilanishi shart}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/db-backup.sh:/db-backup.sh:ro
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  web:
    build: .
    container_name: aiplatforma_web
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=aiplatforma.settings.prod
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - backups_data:/app/backups
      - db_backups:/app/backups/db:ro
    # Port tashqariga ochilmaydi: web faqat nginx orqali (app_network ichida)
    # ishlaydi. Ochiq 8000-port nginx'ni chetlab o'tib, X-Real-IP va
    # X-Forwarded-Proto sarlavhalarini soxtalashtirishga (IP cheklovini
    # aylanib o'tish, login jurnalini buzish) yo'l qo'yardi.
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/accounts/login/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  celery-worker:
    build: .
    container_name: aiplatforma_celery_worker
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    entrypoint: []
    # -B: beat shu konteyner ichida ishlaydi — alohida celery-beat konteyneri
    # (~100 MB RAM) kerak emas. Worker bitta bo'lgani uchun bu xavfsiz;
    # worker'larni ko'paytirsangiz, beat'ni yana alohida xizmatga ajrating.
    command: celery -A aiplatforma worker -B --concurrency=2 --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=aiplatforma.settings.prod
    volumes:
      - media_data:/app/media
    depends_on:
      - redis
      - web
    networks:
      - app_network

  telegram-bot:
    build: .
    container_name: aiplatforma_telegram_bot
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    entrypoint: []
    command: python manage.py run_telegram_bot
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=aiplatforma.settings.prod
    # Bot Telegram orqali kelgan hujjatlarni media'ga saqlaydi va AI
    # topgan hujjatlarni o'qib yuboradi.
    volumes:
      - media_data:/app/media
    depends_on:
      - web
    networks:
      - app_network

  nginx:
    image: nginx:1.27-alpine
    container_name: aiplatforma_nginx
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN .env da belgilanishi shart (masalan, example.uz)}
    # Har 6 soatda qayta yuklanadi — certbot yangilagan sertifikat qo'llanishi
    # uchun. /docker-entrypoint.sh nginx/default.conf.template ni ${DOMAIN}
    # bilan to'ldirib, conf.d/default.conf ga yozadi.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g "daemon off;"'
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static_data:/app/staticfiles:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      # media_data ataylab ulanmagan: yuklangan fayllar Django'ning
      # protected_media view'i orqali, ruxsat tekshiruvi bilan beriladi.
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app_network

  # Let's Encrypt sertifikatini har 12 soatda tekshirib, muddati yaqinlashsa
  # yangilaydi. Birinchi sertifikat: deploy/init-letsencrypt.sh
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: aiplatforma_certbot
    restart: unless-stopped
    logging: *default-logging
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  redis_data:
  postgres_data:
  media_data:
  static_data:
  backups_data:
  db_backups:
  certbot_conf:
  certbot_www:

networks:
  app_network:
    driver: bridge
